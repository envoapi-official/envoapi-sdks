name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sdk-release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      ready: ${{ steps.plan.outputs.resumed == 'true' || steps.push.outputs.ready == 'true' }}
      npm: ${{ steps.plan.outputs.npm }}
      python: ${{ steps.plan.outputs.python }}
      artifact: ${{ steps.plan.outputs.artifact }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Find artifacts from an earlier attempt
        id: restore
        run: node scripts/release.mjs find-artifact
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: steps.restore.outputs.artifact != ''
        with:
          name: ${{ steps.restore.outputs.artifact }}
          path: dist/release
      - name: Select and stamp versions, or resume the saved release
        id: plan
        run: node scripts/release.mjs prepare
        env:
          RESTORED_ARTIFACT: ${{ steps.restore.outputs.artifact }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.plan.outputs.resumed != 'true' && steps.plan.outputs.stale != 'true'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.plan.outputs.resumed != 'true' && steps.plan.outputs.stale != 'true'
        with:
          python-version: "3.11"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: steps.plan.outputs.resumed != 'true' && steps.plan.outputs.stale != 'true'
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.plan.outputs.resumed != 'true' && steps.plan.outputs.stale != 'true'
        with:
          version: "0.10.12"
          enable-cache: false
      - name: Install dependencies and verify the versioned packages
        if: steps.plan.outputs.resumed != 'true' && steps.plan.outputs.stale != 'true'
        run: |
          pnpm install --frozen-lockfile
          uv venv --clear .venv --python 3.11
          uv pip sync --python .venv/bin/python requirements-dev.lock
          pnpm verify
      - name: Save verified packages and create the version commit
        if: steps.plan.outputs.releasing == 'true' && steps.plan.outputs.resumed != 'true'
        run: node scripts/release.mjs seal
      # Store the tested bytes before pushing any public tags, including Go's release tag.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.releasing == 'true' && steps.plan.outputs.resumed != 'true'
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 90
      - name: Push the version commit and SDK tags atomically
        id: push
        if: steps.plan.outputs.releasing == 'true' && steps.plan.outputs.resumed != 'true'
        run: node scripts/release.mjs push

  npm:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: dist/release
      - name: Verify hashes and select unpublished files
        id: check
        run: node scripts/release.mjs check-publication npm
      - name: Publish to npm using OIDC
        if: steps.check.outputs.pending != '0'
        run: |
          npm install --global npm@11.11.0
          npm publish dist/release/upload-npm/*.tgz --access public --ignore-scripts

  python:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true' && needs.prepare.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: dist/release
      - name: Verify hashes and select unpublished files
        id: check
        run: node scripts/release.mjs check-publication python
      - name: Publish to PyPI using OIDC
        if: steps.check.outputs.pending != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/release/upload-python/

  finish:
    needs: [prepare, npm, python]
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.ready == 'true' &&
      (needs.npm.result == 'success' || needs.npm.result == 'skipped') &&
      (needs.python.result == 'success' || needs.python.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ needs.prepare.outputs.artifact }}
          path: dist/release
      - name: Confirm publication and create GitHub release notes
        # Registries can briefly return stale metadata after a successful upload.
        # finish verifies hashes and skips existing releases, so retries are safe.
        run: |
          for attempt in {1..6}; do
            if node scripts/release.mjs finish; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            echo "Finalization attempt $attempt failed; retrying in 30 seconds."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ github.token }}
