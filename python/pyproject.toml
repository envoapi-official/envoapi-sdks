[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "envoapi"
version = "0.1.2"
description = "The EnvoAPI Python SDK with synchronous and asynchronous clients"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "envoapi", email = "envoapi@gmail.com" }]
keywords = ["envoapi", "sdk", "api", "async", "httpx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1,<0.29", "attrs>=22.2.0"]

[project.urls]
Homepage = "https://envoapi.com"
Repository = "https://github.com/envoapi-official/envoapi-sdks"
Documentation = "https://github.com/envoapi-official/envoapi-sdks/blob/main/python/README.md"
Issues = "https://github.com/envoapi-official/envoapi-sdks/issues"
Changelog = "https://github.com/envoapi-official/envoapi-sdks/releases"

[tool.hatch.build.targets.sdist]
include = ["/envoapi", "/README.md", "/pyproject.toml", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["envoapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
